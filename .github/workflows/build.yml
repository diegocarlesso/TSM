name: Build portátil

# macOS e Linux não podem ser empacotados a partir do Windows: o .icns, o .dmg e
# o AppImage precisam das ferramentas de cada sistema. Este fluxo compila os três
# em paralelo, nos runners do GitHub.
#
#   - manualmente:  gh workflow run "Build portátil"
#   - por tag:      git push origin vX.Y.Z
#
# Ao rodar por tag, os artefatos são anexados ao release correspondente.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
            comando: npx electron-builder --win portable dir --x64 --publish never
          - os: ubuntu-latest
            nome: Linux
            comando: npx electron-builder --linux AppImage tar.gz dir --x64 --publish never
          - os: macos-latest
            nome: macOS
            comando: npx electron-builder --mac dmg zip dir --x64 --arm64 --publish never

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar a interface
        run: npm run build:renderer

      - name: Testes do processo principal
        run: node scripts/smoke.js

      - name: Empacotar
        run: ${{ matrix.comando }}
        env:
          # Sem certificado de desenvolvedor: o app sai sem assinatura em vez de
          # falhar o build. No macOS o usuário precisará liberar na primeira
          # abertura (botão direito > Abrir).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Guardar os artefatos
        uses: actions/upload-artifact@v4
        with:
          name: TSM-${{ matrix.nome }}
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn

      - name: Anexar ao release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          arquivos=(dist/*.exe dist/*.AppImage dist/*.tar.gz dist/*.dmg dist/*.zip)
          if [ ${#arquivos[@]} -eq 0 ]; then
            echo "nenhum artefato para anexar"
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" "${arquivos[@]}" --clobber
