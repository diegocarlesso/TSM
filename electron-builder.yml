appId: com.diegocarlesso.tsm
productName: Total Session Manager
copyright: Copyright (c) 2026 Diego Carlesso

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - "!src/renderer/app.bundle.js.map"
  - assets/**/*
  - package.json

# Nenhuma dependencia nativa precisa ser recompilada: `@lydell/node-pty` e
# `@serialport/bindings-cpp` distribuem binarios Node-API (ABI estavel entre
# versoes de Node e Electron) e o SQLite roda em WebAssembly. Deixar o
# electron-builder chamar o node-gyp so faz o empacotamento exigir um compilador
# que nem a maquina de desenvolvimento nem os runners do CI tem configurado.
npmRebuild: false

asarUnpack:
  - "**/node_modules/@lydell/node-pty*/**"
  - "**/node_modules/@serialport/**"
  - "**/node_modules/serialport/**"
  - "**/node_modules/node-sqlite3-wasm/**"
  - "**/node_modules/better-sqlite3/**"

# O TSM e portátil: nada de instalador, nada de registro do Windows.
# `dir`      -> pasta pronta com o executável e os arquivos de apoio
# `portable` -> um único .exe que se auto-extrai e roda
# `AppImage` -> um único arquivo executável no Linux
win:
  icon: assets/app.ico
  target:
    - target: dir
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  artifactName: TSM-${version}-${arch}.${ext}

portable:
  artifactName: TSM-${version}-portable-${arch}.exe
  unpackDirName: TSM
  # Sem atalhos, sem escrever em Program Files.
  requestExecutionLevel: user

linux:
  icon: assets/icon-512.png
  target:
    - target: dir
      arch: [x64, arm64]
    - target: AppImage
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64]
  category: Network
  maintainer: Diego Carlesso
  synopsis: Gerenciador de sessões SSH/Telnet/Shell/SFTP
  artifactName: TSM-${version}-${arch}.${ext}

mac:
  icon: assets/icon-512.png
  target:
    - target: dir
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: TSM-${version}-${arch}.${ext}

dmg:
  # O .dmg aqui e só um envelope para arrastar o .app para onde quiser —
  # o app roda de qualquer pasta, inclusive de um pendrive.
  artifactName: TSM-${version}-${arch}.dmg
  writeUpdateInfo: false
